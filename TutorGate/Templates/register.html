<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Tutor Gate</title>
    <link rel="stylesheet" href="/static/style.css"> <!-- External CSS file -->
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"> <!-- External CSS for icons -->
</head>
<body>
    <div class="wrapper">
        <form action="/register" id="registrationForm" method="POST">
            {{ form.csrf_token }}
            <h1>Welcome!</h1>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {%for category, message in messages%}
                        <div class="alert alert-{{category}}">
                            <button type="button" class="m1-2 mb-1 close" data-dismiss="alert" aria-label="close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                            {{ message }}
                        </div>
                    {%endfor %}
                {% endif %}
            {% endwith %}
            <div class="input-box">
                <input type="text" name="name" placeholder="First Name" required>
            </div>
            <div class="input-box">
                <input type="text" name="LName" placeholder="Last Name" required>
            </div>
            <div class="input-box">
                <input type="email" name="email" placeholder="Email Address" required>
                <i class='bx bxs-user'></i>
            </div>
            <div class="input-box">
                <input type="password" name="password1" placeholder="Password" required>
                <i class='bx bxs-lock-alt'></i>
            </div>
            <div class="input-box">
                <input type="password" name="password2" placeholder="Confirm Password" required>
                <i class='bx bxs-lock-alt'></i>
            </div>
            <button type="submit" class="btn">Register</button>
            <div class="register-link">
                <p>Already Have An Account? <a href="/login" id="loginLink">Login</a></p>
            </div>
        </form>
    </div>
    <script src="/static/register.js"></script>
</body>
</html>
